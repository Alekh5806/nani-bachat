services:
  - type: web
    name: nanibachat-api
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn poolvest.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: PYTHON_VERSION
        value: "3.12.0"
